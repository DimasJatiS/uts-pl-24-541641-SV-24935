# nginx untuk container frontend:
#   /        → file statis hasil build Vue (SPA, fallback ke index.html)
#   /api/... → diteruskan ke container backend (nama service Compose: "backend")
#
# Karena browser hanya melihat satu origin, tidak perlu CORS dan backend
# tidak perlu dibuka ke luar.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # Header keamanan. Catatan: add_header di dalam location akan MENGHAPUS header
    # di level server, jadi location di bawah sengaja memakai "expires", bukan add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP ketat: hanya script/style dari origin sendiri. Ini mitigasi utama XSS
    # karena token login disimpan di localStorage.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Dipakai HEALTHCHECK Docker.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ditimpa (bukan ditambah) supaya klien tidak bisa memalsukan IP-nya,
        # yang dipakai Laravel untuk rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # File hasil build punya hash di namanya → aman di-cache lama.
    location /assets/ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    # Fallback SPA: semua route Vue Router dilayani index.html (tidak di-cache).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
