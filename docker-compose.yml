# ===========================================================================
# ChainFolio — Docker Compose
#
#   Browser ──:8080──► frontend (Nginx) ──/api──► backend (FrankenPHP) ──► db (MySQL)
#
# Jalankan seluruh sistem:  docker compose up -d --build
# ===========================================================================
name: chainfolio

x-logging: &logging-terbatas
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # -------------------------------------------------------------------------
  # Basis data MySQL
  # -------------------------------------------------------------------------
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-chainfolio}
      MYSQL_USER: ${DB_USERNAME:-chainfolio}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di file .env}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - chainfolio-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *logging-terbatas

  # -------------------------------------------------------------------------
  # Backend Laravel FrankenPHP
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      target: runtime
    image: ${BACKEND_IMAGE:-chainfolio-backend}:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      APP_NAME: "ChainFolio"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?Isi APP_KEY di file .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-chainfolio}
      DB_USERNAME: ${DB_USERNAME:-chainfolio}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_TIMEOUT: 3
      LOG_CHANNEL: stdout
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_DRIVER: database
      CACHE_STORE: database
      CACHE_DRIVER: database
      QUEUE_CONNECTION: sync
      SANCTUM_EXPIRATION: ${SANCTUM_EXPIRATION:-1440}
      CORS_ALLOWED_ORIGINS: ${APP_URL:-http://localhost:8080}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - chainfolio-net
    dns_opt:
      - timeout:1
      - attempts:1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 3
      start_period: 40s
    logging: *logging-terbatas

  # -------------------------------------------------------------------------
  # Frontend Vue + Nginx
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_API_BASE_URL: /api
    image: ${FRONTEND_IMAGE:-chainfolio-frontend}:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - chainfolio-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *logging-terbatas

networks:
  chainfolio-net:

volumes:
  db-data: