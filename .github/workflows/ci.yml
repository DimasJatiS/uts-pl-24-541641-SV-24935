# CI/CD ChainFolio
#
#   ┌──────────┐
#   │ backend  │──┐   (Pint, composer audit, php artisan test di MySQL)
#   └──────────┘  │   ┌──────────────────────────────────────────────┐
#                 ├──▶│ deploy  (HANYA push ke main)                 │
#   ┌──────────┐  │   │ build & push image ke ghcr.io + smoke test   │
#   │ frontend │──┘   └──────────────────────────────────────────────┘
#   └──────────┘      (ESLint, npm audit, npm run build)
#
# Job "backend" dan "frontend" dipakai sebagai required status check di branch protection.

name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

# Hak akses default seminimal mungkin; job deploy menambah haknya sendiri.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # PR yang di-push ulang membatalkan run lama; run di main/dev tidak dibatalkan.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: chainfolio_test
          # Database sementara khusus CI, dibuang begitu job selesai.
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Menimpa DB sqlite di phpunit.xml supaya test berjalan di MySQL (sama seperti production).
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: chainfolio_test
      DB_USERNAME: root
      DB_PASSWORD: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Lokasi cache Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validasi composer.json
        run: composer validate --no-check-publish

      - name: Install dependency
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Cek kerentanan dependency (composer audit)
        run: composer audit --abandoned=report

      - name: Cek gaya kode (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Siapkan .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan test (php artisan test)
        run: php artisan test

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependency (npm ci)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Cek kerentanan dependency (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Build produksi
        run: npm run build

  deploy:
    name: deploy
    needs: [backend, frontend]
    # Hanya berjalan saat ada push (termasuk merge PR) ke branch main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Secrets APP_KEY, DB_PASSWORD, DB_ROOT_PASSWORD, COINGECKO_API_KEY disimpan
    # di Settings → Secrets and variables → Actions (repository secrets).
    environment: production
    permissions:
      contents: read
      packages: write # untuk push image ke ghcr.io
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Di level job (bukan per step) karena docker-compose.yml mewajibkan variabel ini
    # di SETIAP perintah compose, termasuk "logs" dan "down" di step pembersihan.
    env:
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tentukan nama image (ghcr.io wajib huruf kecil)
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${repo}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${repo}-frontend" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Dibaca docker compose di step smoke test, log, dan pembersihan.
          echo "BACKEND_IMAGE=ghcr.io/${repo}-backend:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${repo}-frontend:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token otomatis dari GitHub Actions; tidak perlu personal access token.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.backend }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=chainfolio-backend
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push image frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: runtime
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.frontend }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=chainfolio-frontend
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Tanpa VPS: image yang baru di-push dijalankan dengan docker compose di runner
      # memakai GitHub Secrets, lalu diuji end-to-end. Kalau gagal, job merah.
      - name: Smoke test image dari ghcr.io
        run: |
          set -euo pipefail

          for name in APP_KEY DB_PASSWORD DB_ROOT_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name belum diisi (Settings → Secrets and variables → Actions)."
              exit 1
            fi
          done

          docker compose pull backend frontend
          docker compose up -d --no-build --wait --wait-timeout 180
          docker compose ps

          echo "1) Health check"
          curl -fsS http://localhost:8080/api/health

          echo "2) Halaman Vue tersaji"
          curl -fsS http://localhost:8080/ | grep -q '<div id="app">'

          echo "3) Register → token → endpoint terlindungi"
          email="smoke-$(date +%s)@example.com"
          token=$(curl -fsS -X POST http://localhost:8080/api/register \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -d "{\"name\":\"Smoke Test\",\"email\":\"${email}\",\"password\":\"SmokeTest123\",\"password_confirmation\":\"SmokeTest123\"}" \
            | jq -r '.token')
          echo "::add-mask::${token}"
          curl -fsS http://localhost:8080/api/coins -H 'Accept: application/json' \
            -H "Authorization: Bearer ${token}" | jq -e '.data | length > 0'

          echo "4) Tanpa token harus 401"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/holdings -H 'Accept: application/json')
          test "$code" = "401"

      - name: Log container (jika gagal)
        if: failure()
        run: docker compose logs --no-color

      - name: Bersihkan
        if: always()
        run: docker compose down -v
