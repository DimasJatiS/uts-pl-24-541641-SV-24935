global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # metrik http dari frankenphp
  - job_name: chainfolio-backend
    static_configs:
      - targets: ["backend:9180"]
        labels:
          service: backend

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
